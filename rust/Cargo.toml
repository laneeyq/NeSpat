[package]
name = "nespat"
version = "1.2.6"
edition = "2021"
publish = false

[dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSURL", "NSArray", "NSError", "NSObject", "NSXPCConnection", "NSData", "NSJSONSerialization", "NSProcessInfo", "NSUserDefaults", "NSTimer", "NSRunLoop","NSDate","NSFileManager","NSPathUtilities", "block2", "libc"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSAlert", "NSApplication", "NSRunningApplication", "NSWorkspace", "NSStatusItem", "NSStatusBar", "NSStatusBarButton", "NSButton", "NSControl", "NSSwitch", "NSBox","NSText", "NSBezierPath","NSGradient","NSGraphicsContext","NSAppearance","NSBitmapImageRep","NSImageRep","NSGraphics", "NSFont", "NSFontDescriptor", "NSView", "NSViewController", "NSWindow", "NSPopover","NSScreen", "NSGridView", "NSTextField", "NSColor", "NSSegmentedControl", "NSCell", "NSLayoutConstraint", "NSAttributedString", "NSStringDrawing", "objc2-core-foundation"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
libc = "0.2"
plist = "1"
tempfile = "3"
sha2 = "0.10"
base64 = "0.22"
core-foundation = "0.10"

[lib]
name = "nespat_core"
crate-type = ["rlib", "staticlib"]
