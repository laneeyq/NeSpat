[package]
name = "nespat"
version = "1.1.0"
edition = "2021"
publish = false

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSURL", "NSArray", "NSError", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSAlert", "NSApplication", "NSRunningApplication", "NSWorkspace", "NSStatusItem", "NSStatusBar", "NSStatusBarButton", "NSButton", "NSControl", "NSFont", "NSFontDescriptor", "NSView", "NSViewController", "NSWindow", "NSPopover", "NSSegmentedControl", "NSCell", "NSLayoutConstraint", "NSAttributedString", "NSStringDrawing", "objc2-core-foundation"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
serde_json = "1"
libc = "0.2"
plist = "1"
tempfile = "3"
sha2 = "0.10"
base64 = "0.22"
core-foundation = "0.10"

[lib]
name = "nespat_core"
crate-type = ["rlib", "staticlib"]
